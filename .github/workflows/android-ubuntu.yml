name: Minis Next Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK build type (release uses private MinisNext signing)
        type: choice
        options: [release, debug]
        default: release
  push:
    branches: [minis-next]
    paths: ["src/android/**", "src/shared/**", "deps/**", "scripts/**", ".github/workflows/android-ubuntu.yml"]

permissions:
  contents: read

concurrency:
  group: android-ubuntu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu-toolset:
    # Native ARM64 build: phone installation only extracts this ready image.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install rootfs build prerequisites on CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ubuntu-keyring gnupg python3
      - name: Build preinstalled Ubuntu toolset
        run: bash scripts/build_ubuntu_toolset.sh
      - name: Upload preinstalled Ubuntu image for APK job
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-preinstalled-toolset-${{ github.run_number }}
          path: |
            deps/build/ubuntu-toolset/ubuntu-base-arm64.tar.gz
            deps/build/ubuntu-toolset/ubuntu-base-arm64.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
  apk:
    needs: ubuntu-toolset
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: 28.2.13676358
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize Android PRoot source only
        run: git submodule update --init --depth 1 deps/proot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK and Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl unzip xz-utils pkg-config libarchive-tools ripgrep gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Restore private MinisNext release identity
        shell: bash
        env:
          NEXT_KEYSTORE_BASE64: ${{ secrets.NEXT_KEYSTORE_BASE64 }}
          NEXT_STORE_PASSWORD: ${{ secrets.NEXT_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NEXT_KEYSTORE_BASE64"
          test -n "$NEXT_STORE_PASSWORD"
          SIGNING_DIR="${RUNNER_TEMP}/next-private-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          export NEXT_KEYSTORE="$SIGNING_DIR/next-release.p12"
          python3 -c 'import base64,os,pathlib; p=pathlib.Path(os.environ["NEXT_KEYSTORE"]); p.write_bytes(base64.b64decode(os.environ["NEXT_KEYSTORE_BASE64"],validate=True)); p.chmod(0o600)'
          keytool -list -keystore "$NEXT_KEYSTORE" -storepass:env NEXT_STORE_PASSWORD -alias minisnext
          echo "NEXT_KEYSTORE=$NEXT_KEYSTORE" >> "$GITHUB_ENV"
      - name: Native dependency cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/build/rclone
            src/android/app/libs/rclone.aar
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          key: android-native-${{ runner.os }}-ndk28.2-${{ hashFiles('.gitmodules', 'deps/proot', 'deps/build_proot.sh', 'deps/build_rclone_android.sh', 'deps/rclone-mobile/**') }}
      - name: Build Android dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash deps/build_proot.sh
          cd deps/rclone-mobile
          MOBILE=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install "golang.org/x/mobile/cmd/gomobile@${MOBILE}"
          go install "golang.org/x/mobile/cmd/gobind@${MOBILE}"
          gomobile init
          cd ../..
          bash deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
      - name: Save successful native dependencies before APK compilation
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/build/rclone
            src/android/app/libs/rclone.aar
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Chroot launcher and guest offload client
        run: bash scripts/build_chroot_helpers.sh
      - name: Download preinstalled Ubuntu toolset
        uses: actions/download-artifact@v4
        with:
          name: Ubuntu-preinstalled-toolset-${{ github.run_number }}
          path: deps/build/ubuntu-toolset
      - name: Stage verified preinstalled guest
        shell: bash
        run: |
          set -euo pipefail
          cd deps/build/ubuntu-toolset
          sha256sum -c ubuntu-base-arm64.tar.gz.sha256
          cd ../../..
          cp deps/build/ubuntu-toolset/ubuntu-base-arm64.tar.gz src/android/app/src/main/assets/ubuntu-base-arm64.tar.gz
          test -s src/android/app/src/main/assets/proot-aarch64
      - name: Check APK verifier compatibility
        run: |
          python3 -m unittest discover -s scripts/tests -p test_verify_ubuntu_apk.py -v
          python3 -m unittest discover -s scripts/tests -p test_verify_android_launcher.py -v
          python3 -m unittest discover -s scripts/tests -p test_ubuntu_bootstrap.py -v
          python3 -m unittest discover -s scripts/tests -p test_build_ubuntu_toolset.py -v
          python3 -m unittest discover -s scripts/tests -p test_ubuntu_workflow_resources.py -v
          python3 -m unittest discover -s scripts/tests -p test_ubuntu_mcp_runtime.py -v
          python3 -m unittest discover -s scripts/tests -p test_ubuntu_directory_wiring.py -v
          python3 scripts/tests/test_native_composer_port.py
          python3 -m unittest discover -s scripts/tests -p test_kairos_identity.py -v
          python3 -m unittest discover -s scripts/tests -p test_kairos_brand_copy.py -v
          python3 scripts/test_offload_client.py
          python3 -m unittest discover -s scripts/tests -p test_intelligent_ui_contract.py -v
      - name: Build APK
        id: build-apk
        working-directory: src/android
        shell: bash
        env:
          REQUESTED_VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          cp -n app/provider-customization.properties.example app/provider-customization.properties || true
          if [ "$REQUESTED_VARIANT" = debug ]; then TASK=assembleGithubDebug; else TASK=assembleGithubRelease; fi
          # A single invocation previously compiled Debug + Release together,
          # exhausting the Kotlin daemon during IR lowering. Run each variant
          # sequentially in one bounded JVM, without a separate Kotlin daemon.
          free -m
          HEAP_MB=$(python3 -c 'import os; mb=os.sysconf("SC_PAGE_SIZE")*os.sysconf("SC_PHYS_PAGES")//(1024*1024); assert mb>=4096, f"CI runner memory too small: {mb} MiB"; print(min(6144, mb-2048))')
          echo "CI_GRADLE_HEAP_MB=$HEAP_MB" >> "$GITHUB_ENV"
          echo "Gradle/Kotlin shared heap: ${HEAP_MB} MiB; one worker; sequential variants"
          GRADLE_ARGS=(--no-daemon --max-workers=1 --no-parallel
            "-Dorg.gradle.jvmargs=-Xmx${HEAP_MB}m -XX:+UseG1GC -Dfile.encoding=UTF-8"
            -Pkotlin.compiler.execution.strategy=in-process)
          ./gradlew "${GRADLE_ARGS[@]}" \
            :app:testGithubDebugUnitTest --tests '*NativeRootPolicyTest' --tests '*RootConfirmCopyTest' \
            --tests '*UbuntuNormalCompatibilityTest' --tests '*UbuntuToolsetStatusTest' \
            --tests '*RootfsDirectoryMigrationTest' --tests '*RootfsDirectoryMigrationIntegrationTest' \
            --tests '*TarExtractorRootEntryTest' --tests '*ApplicationSystemPromptTest' \
            --tests '*SoulSettingsPageContractTest' --tests '*RootGrantPolicyTest' \
            --tests '*RootLevelGateTest' --tests '*GuestAccountTest' \
            --tests '*SystemChannelPlacementTest' --tests '*SoulIcon*' --tests '*SoulAvatar*' \
            --tests '*GuestGroupNames*' \
            --tests '*SoulBodyLimitPolicyTest' --tests '*HandlerStubRoutingTest' \
            --tests '*ChrootCliTest' --tests '*ChrootCliTriStateTest' \
            --tests '*RootExecPolicyTest' --tests '*RootExecPermissionTest' --tests '*RootExecutionWiringTest' \
            --tests '*ThinkingSliderGeometryTest' --tests '*ComposerPortMathTest' \
            --tests '*ComposerPermissionMenuTest' --tests '*SoulPrompt*' \
            --tests '*OffloadWireTest' --tests '*OffloadClientInstallTest' --tests '*NativeOffloadHardeningTest' \
            --tests '*SubAgentDefinitionTest' --tests '*SubAgentPersistenceTest' \
            --tests '*SubAgentConcurrencyTest' --tests '*AgentJobRegistryTest' --tests '*SubAgentQueueTest' \
            --tests '*ProviderQuotaTest' --tests '*QuotaRelayTest' --tests '*Ubuntu6QuotaChannelsTest' \
            --tests '*SystemPromptInjectionWiringTest' --tests '*SubAgentConcurrencyUiTest' \
            --tests '*Kairos*' --tests '*IntelligentUi*' --tests '*UiExpressionTest' \
            --tests '*UiMath*' --tests '*UiPlotGeometryTest' --tests '*ComposerSurfaceGeometryTest' \
            --tests '*CustomBalance*' --tests '*ModelListReconcileTest' --tests '*ProviderDetailHiddenModelsTest' \
            --tests '*ModelListRefreshTest' --tests '*EmptyKeyRefreshTest' --tests '*CodexModelsApiTest' \
            --tests '*ToolFoldPlannerTest' --tests '*UpdatePolicyTest' --tests '*SoulPromptRuleUiTest'
          # The final extraction test invokes this task again; preserve the first
          # selected-regression XMLs instead of silently replacing their reports.
          cp -a app/build/test-results/testGithubDebugUnitTest app/build/test-results/kairos-regressions
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; d=Path("app/build/test-results/kairos-regressions"); names=("sandbox.RootfsDirectoryMigrationTest","sandbox.RootfsDirectoryMigrationIntegrationTest","agent.SoulIconImportRoboTest","ui.components.SoulAvatarContractTest","sandbox.GuestGroupNamesTest","agent.SoulBodyLimitPolicyTest","agent.SystemPromptInjectionWiringTest","intelligentui.IntelligentUiParserTest","intelligentui.UiExpressionTest","intelligentui.IntelligentUiRenderTest","intelligentui.IntelligentUiExtendedParserTest","intelligentui.IntelligentUiToolLogicTest","intelligentui.IntelligentUiToolsRenderTest","intelligentui.IntelligentUiRichRenderTest","intelligentui.IntelligentUiFieldsRenderTest","intelligentui.IntelligentUiSurfaceTest","intelligentui.UiMathEngineTest","intelligentui.UiMathSchemaTest","intelligentui.UiMathRenderTest","intelligentui.UiMathInteractionRenderTest","intelligentui.UiPlotGeometryTest","ui.chat.ComposerSurfaceGeometryTest","data.CustomBalancePersistenceTest","quota.CustomBalanceQuotaTest","data.repository.ModelListReconcileTest","ui.settings.ProviderDetailHiddenModelsTest","provider.ModelListRefreshTest","provider.EmptyKeyRefreshTest","provider.CodexModelsApiTest"); reports=[E.parse(d/("TEST-com.openminis.app."+n+".xml")).getroot() for n in names]; assert all(int(r.get("tests",0))>0 and all(int(r.get(k,0))==0 for k in ("skipped","failures","errors")) for r in reports), "Missing or skipped MinisNext acceptance tests"; print("PASS real bitmap/global-prompt/guest-group regressions: zero skipped")'
          ./gradlew "${GRADLE_ARGS[@]}" :app:"$TASK"
      - name: Show unit-test failures
        # A failing JVM test is compiled and reported by Gradle, but the run
        # log only carries "FAILED" plus a file:line. Print the assertion
        # messages right here so a red build is diagnosable without a second
        # run, and never let this step fail the job by itself.
        if: failure()
        shell: bash
        run: |
          set +e
          found=0
          for f in $(find src/android/app/build/test-results -name '*.xml' 2>/dev/null); do
            found=1
            echo "── $f"
            grep -h -m 40 -A4 '<failure' "$f" | head -60
          done
          if [ "$found" = 0 ]; then echo "no unit-test XML found"; fi
          exit 0
      - name: Verify APK structure, signatures and metadata
        id: verify-apk
        shell: bash
        env:
          UBUNTU_ROOTFS_SOURCE: src/android/app/src/main/assets/ubuntu-base-arm64.tar.gz
        run: |
          set -euo pipefail
          python3 scripts/verify_ubuntu_apk.py src/android/app/build/outputs/apk/github
      - name: Extract final APK guest with production Kotlin installer
        id: verify-bundled-extraction
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          export MINIS_BUNDLED_APK
          MINIS_BUNDLED_APK=$(python3 -c 'from pathlib import Path; a=list(Path("app/build/outputs/apk/github").glob("**/*.apk")); assert len(a)==1, f"Expected one final APK, got {a}"; print(a[0].resolve())')
          export MINIS_BUNDLED_APK_REQUIRED=1
          ./gradlew --no-daemon --max-workers=1 --no-parallel \
            "-Dorg.gradle.jvmargs=-Xmx${CI_GRADLE_HEAP_MB}m -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testGithubDebugUnitTest --tests '*UbuntuBundledImageCompatibilityTest'
          python3 -c 'from pathlib import Path; import xml.etree.ElementTree as E; p=Path("app/build/test-results/testGithubDebugUnitTest/TEST-com.openminis.app.sandbox.UbuntuBundledImageCompatibilityTest.xml"); r=E.parse(p).getroot(); assert int(r.get("tests",0)) > 0 and all(int(r.get(k,0)) == 0 for k in ("skipped","failures","errors")), E.tostring(r).decode(); print("PASS: final APK extracted by production Kotlin installer; no skipped acceptance tests")'
      - name: Stage verified MinisNext APK artifacts (no GitHub Release)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage_kairos_release.py
      - name: Remove temporary private signing file
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/next-private-signing/next-release.p12"
      - name: Upload APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: MinisNext-arm64-${{ github.run_number }}
          path: |
            release/minis-next/*.apk
            release/minis-next/*.sha256
            release/minis-next/*.json
            src/android/app/build/outputs/mapping/githubRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
      # Diagnostic only: never treat this artifact as an accepted delivery.
      # Retain built bytes if verification fails so diagnosis need not rebuild.
      - name: Retain unverified APK only after a verification failure
        if: failure() && steps.build-apk.outcome == 'success' && (steps.verify-apk.outcome == 'failure' || steps.verify-bundled-extraction.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: UNVERIFIED-diagnostic-APK-${{ github.run_number }}
          path: src/android/app/build/outputs/apk/github/**/*.apk
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results-${{ github.run_number }}
          path: src/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
